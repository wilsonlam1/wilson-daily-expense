<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wilson Daily Expense</title>
<meta name="theme-color" content="#F2EBDD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Expense">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+HK:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#F2EBDD; --surface:#FBF7EF; --card:#E8DCC6; --ink:#1C1B19; --muted:#5F5B53; --muted2:#6B6254;
  --line:#E2D6C2; --field:#F6EFE2; --accent:#7D6A45; --accent-h:#5E4F33; --pill:#EFE6D2; --track:#D6C8AF;
  --h0:#EDE4D4; --h1:#E6D9B8; --h2:#C3AE7F; --h3:#7D6A45; --bar:#D3C39C; --warn:#B4540A; --heat-ink:#3A2F1C;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'Noto Sans HK',system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}a:hover{color:var(--accent-h)}
.num{font-family:Fraunces,Georgia,serif}
.muted{color:var(--muted)}
.layout{min-height:100vh;display:flex}
.side{display:none}
.main{flex:1;min-width:0;padding:16px 16px calc(84px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.top h1{margin:0;font-family:Fraunces,serif;font-size:22px;font-weight:600}
.date-sub{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--pill);color:var(--accent);border:none;min-height:32px;white-space:nowrap}
.pill.warn{color:var(--warn)}
.hero{background:var(--card);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .lbl{font-size:12px;color:var(--muted2)}
.hero .big{font-size:34px;font-weight:600;line-height:1.1}
.hero .rest{font-size:22px;font-weight:500;color:var(--accent)}
.hero .rest.neg{color:var(--warn)}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);border-radius:99px}
.bar>div.over{background:var(--warn)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.card h2{margin:0 0 12px;font-size:15px;font-weight:700}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin:12px 0}
.amount span{font-family:Fraunces,serif;font-size:28px;color:var(--muted)}
.amount input{flex:1;min-width:0;font-family:Fraunces,serif;font-size:40px;font-weight:600;border:none;outline:none;background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--field);font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--field);font-size:15px}
.field:focus,.amount input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{min-height:48px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;padding:0 18px;width:100%}
.btn:hover{background:var(--accent-h)}
.btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--line);font-weight:500;font-size:14px;min-height:40px;width:auto}
.btn.small{min-height:36px;font-size:13px;width:auto;padding:0 12px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:6px 6px 6px 14px;font-size:14px;border:1px solid transparent}
.item.editing{border-color:var(--accent)}
.item .grow{flex:1;min-width:0;background:none;border:none;text-align:left;padding:6px 0;display:flex;justify-content:space-between;gap:8px}
.item .note{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:10px;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{background:var(--field);color:var(--warn)}
.group-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:14px 2px 6px}
.group-h b{color:var(--ink)}
.monthnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.monthnav h1{margin:0;font-family:Fraunces,serif;font-size:22px;font-weight:600}
.navbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile .lbl{font-size:12px;color:var(--muted)}
.tile .v{font-family:Fraunces,serif;font-size:19px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.day{height:46px;border-radius:8px;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;background:var(--h0);color:var(--muted)}
.day .d{font-size:11px;line-height:1}.day .v{font-size:10px;line-height:1;font-weight:700}
.day.l1{background:var(--h1);color:var(--heat-ink)}.day.l2{background:var(--h2);color:var(--heat-ink)}.day.l3{background:var(--h3);color:#fff}
.day.future{background:var(--field);color:#A8A398}
.day.today{outline:2px solid var(--ink);outline-offset:-2px}
.day.sel{box-shadow:0 0 0 3px var(--accent)}
.day.blank{background:transparent;pointer-events:none}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:10px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
.frow{display:flex;align-items:center;gap:8px;background:var(--ground);border-radius:12px;padding:6px 6px 6px 14px;margin-bottom:8px}
.frow input.name{flex:1;min-width:0;border:none;background:transparent;font-size:14px;padding:8px 0}
.frow input.val{width:96px;text-align:right;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:8px;font-family:Fraunces,serif;font-size:15px}
.alloc{display:flex;flex-direction:column;gap:2px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:4px 0}
.arow input{width:120px;text-align:right;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:8px;font-family:Fraunces,serif;font-size:15px}
.arow.sum{font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.arow.good{color:var(--accent);font-size:15px}
.arow.neg{color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:6px;height:200px;border-bottom:1px solid var(--line);padding:0 2px;position:relative}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;position:relative;min-width:0}
.chart .b{width:100%;max-width:40px;background:var(--bar);border-radius:5px 5px 0 0}
.chart .b.cur{background:var(--accent)}
.chart .b.over{background:var(--warn)}
.chart .tick{position:absolute;left:10%;right:10%;border-top:1.5px dashed var(--warn)}
.chart .lab{font-size:10px;font-weight:700;white-space:nowrap}
.xl{display:flex;gap:6px;padding:4px 2px 0}.xl div{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:0}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tab{height:64px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tab.on{color:var(--accent);font-weight:700}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
.toast.show{opacity:1}
label.lab{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.two{display:block}
.kpis{display:none}
@media (min-width: 960px){
  .side{display:flex;flex-direction:column;gap:28px;width:232px;flex-shrink:0;background:var(--card);padding:28px 20px;position:sticky;top:0;height:100vh}
  .side .brand{font-family:Fraunces,serif;font-size:22px;font-weight:600;line-height:1.15}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{text-align:left;padding:10px 12px;border-radius:10px;border:none;background:none;color:var(--muted2);font-size:14px}
  .side nav button.on{background:var(--surface);color:var(--ink);font-weight:700}
  .side .foot{margin-top:auto;font-size:12px;color:var(--muted2);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .tabs{display:none}
  .main{max-width:1200px;padding:28px 32px}
  .two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:20px;align-items:start}
  .two .card:first-child{margin-top:0}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
  .kpi{background:var(--surface);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px}
  .kpi.dark{background:var(--card)}
  .kpi .lbl{font-size:13px;color:var(--muted)}
  .kpi .v{font-family:Fraunces,serif;font-size:28px;font-weight:600}
  .kpi .s{font-size:12px;color:var(--muted)}
  .mob-hero{display:none}
  .toast{bottom:32px}
  .chart{height:260px}
  .monthnav{justify-content:flex-start;gap:14px}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">Wilson<br>Daily Expense</div>
    <nav id="sidenav"></nav>
    <div class="foot"><span id="sideSync"></span><button class="btn ghost small" data-act="sync">立即同步</button></div>
  </aside>
  <main class="main" id="app"></main>
</div>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
// ---------- helpers ----------
var $ = function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return ymd(new Date())}
function mkey(s){return s.slice(0,7)}
function daysIn(key){var p=key.split('-');return new Date(+p[0],+p[1],0).getDate()}
function shiftMonth(key,n){var p=key.split('-');var d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function money(n,dp){if(dp==null)dp=1;var neg=n<0;n=Math.abs(n);var s=n.toFixed(dp).replace(/\B(?=(\d{3})+(?!\d))/g,',');return (neg?'−$':'$')+s}
function r2(n){return Math.round(n*100)/100}
function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function parseAmt(s){s=String(s||'').replace(/\s/g,'').replace(/[＋]/g,'+');if(!s)return NaN;if(!/^[\d.+\-*/()]+$/.test(s))return NaN;try{var v=Function('"use strict";return ('+s+')')();return (typeof v==='number'&&isFinite(v))?r2(v):NaN}catch(e){return NaN}}
function ls(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x?JSON.parse(x):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
var WD=['日','一','二','三','四','五','六'];
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2200)}
var ICON={
  plus:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  cal:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  chart:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  gear:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>',
  left:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>',
  right:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  ok:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
};

// ---------- state ----------
var DEFAULT_CATS=['早餐','午餐','晚餐','交通','咖啡','買餸','購物','運動','其他'];
function emptyData(){return {app:'Wilson Daily Expense',version:1,settings:{categories:DEFAULT_CATS.slice(),u:0},months:{},entries:[],deleted:[]}}
var data=ls('wde_data')||emptyData();
var cfg=ls('wde_cfg')||{owner:'',repo:'wilson-daily-expense-data',path:'data.json',branch:'main',token:''};
var sha=ls('wde_sha')||null;
var dirty=!!ls('wde_dirty');
var S={view:'entry',month:mkey(todayStr()),date:todayStr(),cat:'',editId:null,selDay:null,sync:'idle'};

function saveLocal(){ls('wde_data',data);ls('wde_sha',sha);ls('wde_dirty',dirty)}
function touch(){dirty=true;saveLocal();schedulePush()}

// month settings: stored or inherited from the latest earlier month
function monthCfg(key){
  if(data.months[key])return {m:data.months[key],inherited:false};
  var keys=Object.keys(data.months).filter(function(k){return k<key}).sort();
  var prev=keys.length?data.months[keys[keys.length-1]]:null;
  var fixed={};if(prev)for(var f in prev.fixed)fixed[f]=prev.fixed[f];
  return {inherited:true,m:{budget:prev?prev.budget:3000,fixed:fixed,income:prev?prev.income:0,extraIncome:0,household:prev?prev.household:0,mortgage:prev?prev.mortgage:0,otherExpense:0,savingRate:prev?prev.savingRate:0,savingFixed:prev?prev.savingFixed:0,u:0}};
}
function materialize(key){var c=monthCfg(key);if(c.inherited)data.months[key]=JSON.parse(JSON.stringify(c.m));return data.months[key]}
function entriesOf(prefix){return data.entries.filter(function(e){return e.d.indexOf(prefix)===0})}
function calc(key){
  var c=monthCfg(key).m;var daily=0;entriesOf(key).forEach(function(e){daily+=e.a});
  var fixed=0;for(var f in c.fixed)fixed+=(+c.fixed[f]||0);
  var own=daily+fixed;var dim=daysIn(key);var t=todayStr();var tk=mkey(t);
  var elapsed=key<tk?dim:(key===tk?+t.slice(8):0);
  var left=key===tk?dim-elapsed+1:(key>tk?dim:0);
  var totalIncome=(+c.income||0)+(+c.extraIncome||0);
  var saving=c.savingRate?totalIncome*c.savingRate:(+c.savingFixed||0);
  var othersBudget=totalIncome-(+c.household||0)-(+c.budget||0)-saving-(+c.mortgage||0);
  var extraSaving=totalIncome-(+c.mortgage||0)-(+c.household||0)-own-(+c.otherExpense||0)-saving;
  return {c:c,daily:daily,fixed:fixed,own:own,net:(+c.budget||0)-own,avg:elapsed?own/elapsed:0,left:left,totalIncome:totalIncome,saving:saving,othersBudget:othersBudget,otherNet:othersBudget-(+c.otherExpense||0),extraSaving:extraSaving,totalSaving:saving+extraSaving,pct:c.budget?Math.min(100,own/c.budget*100):0};
}

// ---------- GitHub sync ----------
var API='https://api.github.com';
function ghReady(){return cfg.owner&&cfg.repo&&cfg.path&&cfg.token}
function ghUrl(){return API+'/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+cfg.path.split('/').map(encodeURIComponent).join('/')}
function ghHeaders(extra){var h={'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};for(var k in extra||{})h[k]=extra[k];return h}
function b64enc(str){var bytes=new TextEncoder().encode(str);var bin='';for(var i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin)}
function b64dec(b64){var bin=atob(b64.replace(/\n/g,''));var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
function merge(a,b){
  var del={};(a.deleted||[]).concat(b.deleted||[]).forEach(function(id){del[id]=1});
  var map={};[b,a].forEach(function(src){(src.entries||[]).forEach(function(e){if(del[e.id])return;var cur=map[e.id];if(!cur||(e.u||0)>=(cur.u||0))map[e.id]=e})});
  var months={};var keys={};Object.keys(a.months||{}).concat(Object.keys(b.months||{})).forEach(function(k){keys[k]=1});
  Object.keys(keys).forEach(function(k){var x=(a.months||{})[k],y=(b.months||{})[k];months[k]=!x?y:!y?x:((x.u||0)>=(y.u||0)?x:y)});
  var st=((a.settings||{}).u||0)>=((b.settings||{}).u||0)?a.settings:b.settings;
  var ents=Object.keys(map).map(function(k){return map[k]}).sort(function(p,q){return p.d<q.d?-1:p.d>q.d?1:0});
  return {app:'Wilson Daily Expense',version:1,settings:st||{categories:DEFAULT_CATS.slice(),u:0},months:months,entries:ents,deleted:Object.keys(del)};
}
var busy=false,pushTimer=null,again=false;
function setSync(s){S.sync=s;renderSync()}
async function pull(){
  if(!ghReady()){setSync('nocfg');return}
  if(busy){again=true;return}
  busy=true;setSync('busy');
  try{
    var r=await fetch(ghUrl()+'?ref='+encodeURIComponent(cfg.branch||'main')+'&t='+Date.now(),{headers:ghHeaders(),cache:'no-store'});
    if(r.status===404){ // file not created yet
      sha=null;busy=false;dirty=true;saveLocal();await push();return;
    }
    if(!r.ok)throw new Error('讀取失敗 ('+r.status+')');
    var j=await r.json();var text;
    if(j.encoding==='base64'&&j.content)text=b64dec(j.content);
    else{var rr=await fetch(ghUrl()+'?ref='+encodeURIComponent(cfg.branch||'main')+'&t='+Date.now(),{headers:ghHeaders({'Accept':'application/vnd.github.raw+json'}),cache:'no-store'});if(!rr.ok)throw new Error('讀取失敗 ('+rr.status+')');text=await rr.text()}
    var remote=JSON.parse(text);
    sha=j.sha;
    if(dirty){data=merge(data,remote)}else{data=remote;if(!data.deleted)data.deleted=[]}
    saveLocal();busy=false;
    if(dirty){await push()}else setSync('ok');
    render();
  }catch(e){busy=false;setSync('err');console.error(e);toast(e.message||'同步失敗')}
  if(again){again=false;pull()}
}
async function push(){
  if(!ghReady()){setSync('nocfg');return}
  if(busy){again=true;return}
  busy=true;setSync('busy');
  try{
    var body={message:'Update expense '+new Date().toISOString(),content:b64enc(JSON.stringify(data)),branch:cfg.branch||'main'};
    if(sha)body.sha=sha;
    var r=await fetch(ghUrl(),{method:'PUT',headers:ghHeaders({'Content-Type':'application/json'}),body:JSON.stringify(body)});
    if(r.status===409||r.status===422){busy=false;await pull();return} // someone else saved: merge then retry
    if(!r.ok){var t='';try{t=(await r.json()).message}catch(_){}throw new Error('上載失敗 ('+r.status+') '+t)}
    var j=await r.json();sha=j.content.sha;dirty=false;saveLocal();busy=false;setSync('ok');
  }catch(e){busy=false;setSync('err');console.error(e);toast(e.message||'上載失敗')}
  if(again){again=false;dirty?push():setSync('ok')}
}

  }else if(f.id==='catForm'){
    var list=$('#cats').value.split(/[、,，]/).map(function(s){return s.trim()}).filter(Boolean);
    data.settings={categories:list,u:Date.now()};touch();render();toast('類別已儲存');
  }
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='fDate'){S.date=el.value||todayStr();var amt=$('#fAmt').value,note=$('#fNote').value;render();$('#fAmt').value=amt;$('#fNote').value=note;return}
  if(el.id==='impFile'&&el.files[0]){var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j.entries||!j.months)throw 0;if(!confirm('用呢個檔案同現有資料合併？'))return;data=merge(data,j);touch();render();toast('已匯入')}catch(e){toast('檔案格式唔啱')}};r.readAsText(el.files[0]);return}
  var m;
  if(el.dataset.mf){m=materialize(S.month);var f=el.dataset.mf;m[f]=f==='savingRate'?+el.value:(parseAmt(el.value)||0);m.u=Date.now();touch();render()}
  else if(el.dataset.fixval!=null){m=materialize(S.month);m.fixed[el.dataset.fixval]=parseAmt(el.value)||0;m.u=Date.now();touch();render()}
  else if(el.dataset.fixname!=null){var old=el.dataset.fixname,nw=el.value.trim();if(!nw||nw===old){el.value=old;return}m=materialize(S.month);var o={};Object.keys(m.fixed).forEach(function(k){o[k===old?nw:k]=m.fixed[k]});m.fixed=o;m.u=Date.now();touch();render()}
});
window.addEventListener('focus',function(){if(ghReady()&&!busy)dirty?push():pull()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&ghReady()&&!busy)dirty?push():pull()});

// ---------- start ----------
if(!data.deleted)data.deleted=[];
render();
if(ghReady())(dirty?push():pull());else{setSync('nocfg');if(!data.entries.length){S.view='settings';render()}}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
